databases:
  - name: shalfa-postgres
    plan: basic-256mb
    databaseName: shalfa_ops
    user: shalfa_ops
services:
  - type: web
    name: shalfa-operations-enterprise
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/database
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shalfa-postgres
          property: connectionString
